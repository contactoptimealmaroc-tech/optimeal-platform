services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://optimeal:${POSTGRES_PASSWORD}@db:5432/optimeal
      SESSION_COOKIE: ${SESSION_COOKIE:-optimeal_session}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-28800}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://optimeal.ma}
      APP_BASE_URL: ${APP_BASE_URL:-https://app.optimeal.ma}
      API_BASE_URL: ${API_BASE_URL:-https://api.optimeal.ma}
      CARTE_BASE_URL: ${CARTE_BASE_URL:-https://carte.optimeal.ma}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://optimeal.ma,https://www.optimeal.ma,https://app.optimeal.ma}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: optimeal
      POSTGRES_USER: optimeal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U optimeal -d optimeal"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/optimeal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  pgdata:
