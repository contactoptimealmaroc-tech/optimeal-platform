# OptiMeal — reverse proxy / subdomain map
# TLS certificates are intentionally managed outside this file (e.g. Certbot/Caddy).

upstream optimeal_api { server web:8000; }

server {
    listen 80;
    server_name optimeal.ma www.optimeal.ma;
    location / { proxy_pass http://optimeal_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}

server {
    listen 80;
    server_name app.optimeal.ma;
    location / { proxy_pass http://optimeal_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}

server {
    listen 80;
    server_name api.optimeal.ma;
    location /api/ { proxy_pass http://optimeal_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { return 404; }
}

# carte.optimeal.ma is intentionally NOT proxied here while the ordering platform remains external.
# Configure this hostname as CNAME/redirect according to the platform provider's instructions.
