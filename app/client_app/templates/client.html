<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptiMeal · Espace Client</title><style>body{margin:0;background:#f7f3eb;color:#173e38;font-family:Inter,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:40px}.top{display:flex;justify-content:space-between;gap:20px}button{padding:10px 16px;border:0;border-radius:8px;background:#075f54;color:white}.panel{background:#fff;border:1px solid #dfe6e2;border-radius:16px;padding:24px;margin-top:20px}</style></head><body><main class="wrap"><div class="top"><div><small>OPTIMEAL · CLIENT</small><h1 id="name">Chargement…</h1></div><button onclick="logout()">Déconnexion</button></div><section class="panel"><h2>Parcours</h2><p id="status"></p><div id="menus"></div></section></main><script>async function api(u,o){const r=await fetch(u,o);if(r.status===401){location='/connexion';throw 0}return r.json()}async function load(){const p=await api('/api/v1/client/me');name.textContent=p.full_name||'Espace client';status.textContent=`ON1: ${p.on1_completed?'validé':'à compléter'} · ON2: ${p.on2_completed?'validé':'à compléter'}`;const ms=await api('/api/v1/client/menus');menus.innerHTML=ms.length?ms.map(c=>`<article><strong>Cycle ${c.start_date} → ${c.end_date}</strong><div>${c.days.map(d=>`${d.date} · recette #${d.recipe_id??'à définir'} · ${d.status}`).join('<br>')}</div></article>`).join('<hr>'):'Aucun cycle publié.'}async function logout(){await fetch('/api/v1/auth/logout',{method:'POST'});location='/'}load()</script></body></html>
