<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptiMeal · OS</title><style>body{margin:0;background:#102f2b;color:#f7f3eb;font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:40px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#17453f;padding:22px;border-radius:14px}.bar{display:flex;justify-content:space-between}button{padding:10px 16px;border:0;border-radius:8px;background:#c9a86a;color:#173e38}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="bar"><div><small>OPTIMEAL · OPERATING SYSTEM</small><h1>OS</h1></div><button onclick="logout()">Déconnexion</button></div><div class="grid"><div class="card"><small>CLIENTS</small><h2 id="clients">—</h2></div><div class="card"><small>CYCLES</small><h2 id="cycles">—</h2></div><div class="card"><small>RECETTES</small><h2 id="recipes">—</h2></div></div><div class="card" style="margin-top:18px"><h2>Clients</h2><div id="list">Chargement…</div></div></main><script>async function api(u,o){const r=await fetch(u,o);if(r.status===401||r.status===403){location='/connexion';throw 0}return r.json()}async function load(){const d=await api('/api/v1/os/dashboard');clients.textContent=d.clients;cycles.textContent=d.cycles;recipes.textContent=d.recipes;const rows=await api('/api/v1/os/clients');list.innerHTML=rows.map(x=>`<div style="padding:12px 0;border-bottom:1px solid #ffffff22"><strong>${x.full_name||'Sans nom'}</strong> · ${x.city} · ON1 ${x.on1?'✓':'—'} · ON2 ${x.on2?'✓':'—'}</div>`).join('')||'Aucun client.'}async function logout(){await fetch('/api/v1/auth/logout',{method:'POST'});location='/'}load()</script></body></html>
