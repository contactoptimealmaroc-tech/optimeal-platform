<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptiMeal · Connexion</title><style>body{margin:0;background:#f5f0e7;color:#173e38;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,calc(100% - 40px));background:#fff;padding:42px;border-radius:18px;box-shadow:0 20px 60px #173e3820}h1{font-family:Georgia,serif;font-weight:400}input,button{width:100%;padding:13px;margin:7px 0;border:1px solid #ccd7d2;border-radius:8px;box-sizing:border-box}button{background:#075f54;color:white;cursor:pointer}.msg{margin-top:14px}</style></head><body><main class="card"><div>OPTIMEAL</div><h1>Votre espace.</h1><form id="f"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Mot de passe" required><button>Se connecter</button></form><div id="m" class="msg"></div></main><script>f.onsubmit=async e=>{e.preventDefault();m.textContent='Connexion…';const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(!r.ok){m.textContent='Identifiants invalides.';return}location.href=j.role==='CLIENT'?'/client':'/os'}</script></body></html>
